<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Text Refiner – Settings</title>
  <style>
    body { font-family: Arial, sans-serif; width: 260px; padding: 12px; }
    h3   { margin: 0 0 10px; font-size: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 13px; }
    input[type="password"] { width: 100%; padding: 5px; box-sizing: border-box; font-size: 13px; }
    button { margin-top: 10px; padding: 5px 12px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 0.88em; color: green; }
  </style>
</head>
<body>
<h3>🔑 Groq API Key</h3>
<label for="apiKey">Enter your Groq API key:</label>
<input type="password" id="apiKey" placeholder="gsk_..." autocomplete="off">
<button id="saveBtn">Save</button>
<div id="status"></div>
<script src="popup.js"></script>
</body>
</html>
